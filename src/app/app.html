<div class="app-shell">
  <header class="topbar" (keydown.escape)="closeMenu()">
    <a class="brand" routerLink="/" aria-label="Golf Caddie home">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span>Golf Caddie</span>
    </a>
    <button
      class="nav-toggle"
      type="button"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="toggleMenu()"
    >
      <span class="nav-toggle-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
    <nav
      id="main-navigation"
      class="main-nav"
      [class.open]="menuOpen"
      aria-label="Main navigation"
    >
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Shot advisor</a>
      <a routerLink="/my-bag" routerLinkActive="active" (click)="closeMenu()">My Bag</a>
      <a routerLink="/settings" routerLinkActive="active" (click)="closeMenu()">Settings</a>
    </nav>
  </header>
  <main class="page-wrap"><router-outlet /></main>
  <footer class="site-footer">A simple playing partner. Your numbers stay on this device.</footer>
</div>
